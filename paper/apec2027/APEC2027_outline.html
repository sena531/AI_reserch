<script type="application/json" id="paper-state">{"updatedAt":"2026-11-19T07:08:59.776Z","title":"Single-Stage Bridgeless PFC Converter Integrating Phase-Shift Full-Bridge Operation for Low Intermediate Voltage and Ceramic-Capacitor Miniaturization","authors":"Sena Hirata, Kakemune Kabashima, Hiroaki Hayashi, Haruki Kanto, Yoichi Ishizuka (Nagasaki University)","pageLimit":6,"deadline":"2026-12-07","notes":"【ePapers 要件（APEC 2027）】\n・ページ数：推奨 6 ページ以内（図・表・謝辞・参考文献すべて含む）／上限 8 ページ（超過は 1 ページ 100 ドル）\n・用紙 US Letter、ページ番号なし、全フォント埋め込み（Type 3 不可）、PDF 5MB 以下、セキュリティ設定なし\n・IEEE PDF eXpress で PDF をチェックしてから提出\n・AI を使った場合は Acknowledgment に明記（必須）\n・自己引用・相互引用の割合に上限あり（20% 程度・要確認）、提出時に件数を申告\n・CrossCheck（類似度チェック）あり。自分の過去発表との重複も対象\n・提出手順：Paper Summary Form → 参加登録 → PDF アップロード → IEEE 著作権フォーム\n・締切 2026-12-07 は画像からの読み取りで未確定。公式サイトで確認\n\n【ドラフトの状況】\n・Word 原稿 APEC2027_draft.docx に本文の初稿を作成済み（現状 約 4 ページ）\n・本文の黄色マーカー＝未確定・要記入（このページでは【要記入 …】で表示）\n・名称は題目に合わせて「Single-Stage Bridgeless PFC Converter」に統一\n・式・Table I の値はファームウェアの定数から転記。試作機と照合すること","sections":[{"id":"abs","name":"Abstract","numbered":false,"status":"draft","pages":0.25,"hint":"背景 → 提案 → 効果を数値で。数式・記号・特殊文字は使わない（テンプレート規定）。","points":"既存研究との差別化を書く\n※現在、APECのダイジェストで記入したものと同じもの記入","figs":"なし","draft":"This paper addresses two key limitations of conventional PFC-based AC- DC converters with a 400 V intermediate bus: the increased transformer turns ratio, which raises winding loss and common- mode noise, and the large electrolytic capacitance required to buffer twice- line- frequency ripple. A single- stage converter integrating a bridgeless PFC and a phase- shift full- bridge (PSFB) is proposed to reduce the intermediate bus voltage to around 200 V while maintaining isolated 48 V output conversion.ー  This lower bus voltage halves the transformer turns ratio and reduces the required PFC output capacitance to about 1/100 of the conventional value, enabling,  ceramic-capacitor implementation. PSIM simulations with 100 V AC input and 48 V DC output confirm sinusoidal input current and reduced transformer primary voltage. A light- load mode that disables PFC switching below the IEC 61000-3-2 applicable power range improves power factor and efficiency by about 10% compared with a conventional PFC + LLC circuit. Prototype experiments verify stable light- load operation, while feedback-controlled heavy-load validation remains future work.\n\nKeywords— bridgeless PFC, phase-shift full-bridge converter, single-stage converter, ceramic capacitor"},{"id":"intro","name":"Introduction","numbered":true,"status":"draft","pages":0.6,"hint":"2段構成の課題 → 先行研究とその限界 → 提案と貢献。新規性をここで言い切る。","points":"先行研究の段落（[3]–[5]）を書く\n引用文献を実在の論文で確定","figs":"","draft":"AC-dc power supplies with a low-voltage output such as 48 V for telecommunication and data-center equipment are commonly built as a two-stage configuration: a boost power factor correction (PFC) converter followed by an isolated dc-dc converter such as a phase-shift full-bridge (PSFB) converter 【要記入 1】, 【要記入 2】. In this configuration, the PFC stage regulates an intermediate bus voltage of about 【要記入 380–400】 V, and a bulk electrolytic capacitor on this bus absorbs the power pulsation at twice the line frequency. This capacitor occupies a large part of the converter volume and limits its lifetime, and the high bus voltage requires high-voltage-rated devices in the dc-dc stage.\n\nSingle-stage PFC converters that merge the PFC and the isolated dc-dc conversion have been studied to reduce the number of conversion stages 【要記入 3】–【要記入 5】. 【要記入 先行研究（Buck PFC・単段方式・ブリッジレス＋絶縁型）の方式と限界を2〜3文で。例：中間電圧が高い／大容量の中間コンデンサが残る／入力電流のゼロクロス歪みが大きい など】\n\nThis paper proposes a single-stage bridgeless PFC converter that integrates PSFB operation. The split intermediate capacitors Cs1 and Cs2, charged alternately by the bridgeless stage in each half line cycle, directly serve as the input rails of the full bridge. The contributions of this paper are as follows:\n\n・The intermediate voltage is reduced to about 200 V, which is about half of that of the conventional two-stage configuration.\n\n・The twice-line power pulsation is not stored in the intermediate capacitors, so that they can be miniaturized with ceramic capacitors.\n\n・The design equation of the phase-shift ratio and the transformer dc bias caused by the unbalance between Vcs1 and Vcs2 are derived, and a compensation method is presented.\n\n・The operation is verified by simulation and a 480 W prototype."},{"id":"conv","name":"Conventional Two-Stage Configuration","numbered":true,"status":"draft","pages":0.5,"hint":"提案の動機付けに要る分だけ簡潔に。","points":"Cbus の数値例を確認\nFig. 1 を作図","figs":"Fig. 1  Conventional two-stage configuration of a boost PFC converter and a PSFB converter.","draft":"Fig. 1 shows the conventional two-stage configuration composed of a boost PFC converter and a PSFB converter. The boost PFC converter shapes the input current into a sinusoid by average current control and regulates the bus voltage Vbus with a voltage loop whose bandwidth is well below twice the line frequency. Since the instantaneous input power pulsates at twice the line frequency while the output power is constant, the bus capacitor Cbus must absorb this pulsation. For a bus voltage ripple of ΔVbus, the required capacitance is\n\n(1)  C_bus = P_o / (2π f_L V_bus ΔV_bus)\n\nwhere Po is the output power and fL is the line frequency. 【要記入 例：Po = 480 W, fL = 50 Hz, Vbus = 400 V, ΔVbus = 20 V のとき Cbus ≈ 191 µF → 電解コンデンサが必要、と数値で示す（要確認）】 In addition, the switches of the PSFB stage must be rated for the bus voltage of about 400 V, and the power is processed twice in the cascaded stages."},{"id":"prop","name":"Proposed Single-Stage Bridgeless PFC Converter","numbered":true,"status":"draft","pages":1.25,"hint":"回路構成、PFC 部と FB 部の動作、制御方式。","points":"回路接続の記述を回路図と照合\nFig. 2〜5 を作図","figs":"Fig. 2  Proposed single-stage bridgeless PFC converter integrating PSFB operation.\nFig. 3  Operating modes of the full-bridge stage.\nFig. 4  Key operating waveforms.\nFig. 5  Control block diagram of the proposed converter.","draft":"■ Circuit Configuration\n\nFig. 2 shows the proposed converter. The bridgeless PFC stage consists of the input inductor L and the low-side switches Q1 and Q2. The split capacitors Cs1 and Cs2 are charged alternately in the positive and negative half line cycles. The full bridge consists of leg A (Q3, Q4) and leg B (Q5, Q6); the high-side switch Q3 of leg A is supplied from Cs1, and the high-side switch Q6 of leg B is supplied from Cs2. The transformer with a turns ratio n and a leakage inductance Llk feeds a center-tapped rectifier and the output capacitor Co. 【要記入 回路接続の記述は実際の回路図と照合して修正すること】\n\n■ Operating Principle of the PFC Stage\n\nIn the positive half line cycle, Q1 operates with high-frequency PWM and the current returns through the body diode of Q2; in the negative half cycle, the roles of Q1 and Q2 are exchanged. In each half cycle, the stage operates as a boost converter, and the duty ratio D satisfies\n\n(2)  V_cs = |v_ac| / (1 − D)\n\nSince the intermediate voltage of about 200 V is higher than the peak line voltage of 141 V, the boost operation continues over the whole line cycle and no dead zone appears in the input current near the zero crossing.\n\n■ Operating Principle of the Full-Bridge Stage\n\nBoth legs operate with a 50 percent duty ratio in complementary mode, and leg B is phase-shifted from leg A by the phase-shift ratio D1. Fig. 3 shows the operating modes and Fig. 4 shows the key waveforms. During the power-transfer interval, Vcs1 or Vcs2 is applied to the primary winding, and during the freewheeling interval, both high-side switches conduct and the difference Vcs1 − Vcs2 appears across the winding.\n\n■ Control Scheme\n\nFig. 5 shows the control block diagram. The input current is regulated by average current control with a feedforward term executed every switching period of 100 kHz. The output voltage loop updates the amplitude of the current reference once per line period using the moving average of the output voltage over one line cycle, which removes the twice-line ripple from the feedback. The phase-shift ratio D1 is fixed at the design value given in Section IV."},{"id":"ana","name":"Analysis of the Proposed Converter","numbered":true,"status":"draft","pages":1.1,"hint":"位相シフト設計、中間コンデンサ、トランス直流偏磁、入力高調波。","points":"式(3)の導出を追記\nCs の必要容量と体積比較\n偏磁補償の効果\n高調波（IEC 61000-3-2）の節を書く","figs":"","draft":"■ Design of the Phase-Shift Ratio\n\nThe power is transferred through the leakage inductance Llk. From the steady-state analysis, the phase-shift ratio required to supply the output current Io at the output voltage Vo is\n\n(3)  D_1 = sqrt( V_o L_lk I_o / ( T_s V_cs (V_cs − n V_o) ) )\n\nwhere Ts is the switching period. With Vcs = 200 V, Vo = 48 V, Io = 10 A, Llk = 5 µH, Ts = 10 µs, and n = 4, (3) gives D1 = 0.387. Since (Vcs − nVo) appears in the denominator, D1 is sensitive to the intermediate voltage; for example, Vcs = 220 V gives D1 = 0.197. Conversely, under light load, Vcs is clamped near nVo. 【要記入 式(3)の導出過程を2〜3行で追記】\n\n■ Twice-Line Power Pulsation and Intermediate Capacitors\n\nBecause D1 is fixed and Cs1 and Cs2 are charged alternately, Vcs varies with the instantaneous input power, and the full bridge transfers the pulsating power to the output side. Therefore, the twice-line pulsation is absorbed by the output capacitor Co at 48 V instead of by a high-voltage bulk capacitor, and Cs1 and Cs2 only need to filter the switching-frequency ripple. 【要記入 必要な Cs の容量の式、電解コンデンサ案との体積比較（数値）を追加】\n\n■ Transformer DC Bias Due to Capacitor Unbalance\n\nSince Cs1 and Cs2 are charged in alternate half cycles, Vcs1 and Vcs2 fluctuate in antiphase at twice the line frequency. During the freewheeling interval, the difference between them is applied to the primary winding, and the average primary voltage over one switching period becomes\n\n(4)  V_dc,pri ≈ (V_cs1 − V_cs2) D_1\n\nFor a difference of 50 V and D1 = 0.387, the dc component reaches about 20 V and may saturate the transformer with a magnetizing inductance of 3 mH. This bias is compensated by trimming the duty ratios of the legs by about (ΔVcs/Vcs)·Ts/4, with the sign reversed every half line cycle. 【要記入 補償方法の説明と効果（波形・励磁電流）を追記。半周期内の残留成分についても言及】\n\n■ Input Current Harmonics\n\n【要記入 入力電流の力率・THD の解析、IEC 61000-3-2 Class A の限度値との比較（表または図）。ゼロクロス付近の歪み要因（帰路ボディダイオードの順方向電圧など）にも触れる】"},{"id":"sim","name":"Simulation Results","numbered":true,"status":"outline","pages":0.5,"hint":"解析の妥当性確認。実験と重複する波形は削る。","points":"PF・THD のシミュレーション値\nFig. 6","figs":"TABLE I  Circuit Parameters\n  【要記入 数値はファームウェアの定数から転記。試作機の実測値と照合すること】\nFig. 6  Simulated waveforms at the rated load.\n  Parameter | Value\n  Input voltage / frequency | 100 Vrms / 50 Hz\n  Output voltage / current | 48 V / 10 A (480 W)\n  Switching frequency | 100 kHz\n  Intermediate voltage (design) | 200 V\n  Input inductance L | 1 mH\n  Split capacitors Cs1, Cs2 | 【要記入 TBD µF, ceramic】\n  Turns ratio n | 4\n  Leakage / magnetizing inductance | 5 µH / 3 mH\n  Output capacitance Co | 7.8 mF\n  Controller | dsPIC33EP128GS808","draft":"The operation of the proposed converter was verified by circuit simulation using 【要記入 Scideam】 with the parameters listed in Table I. Fig. 6 shows the simulated waveforms of the input voltage, input current, intermediate voltages, and output voltage at the rated load. The power factor and the total harmonic distortion of the input current were 【要記入 TBD】 and 【要記入 TBD】 percent, respectively. 【要記入 実験と重複する波形は削ってページ数を節約】"},{"id":"exp","name":"Experimental Results","numbered":true,"status":"outline","pages":1.1,"hint":"試作機写真・波形・効率/PF 特性・比較表。","points":"実験データを取得して数値を記入\nFig. 7〜9、TABLE II","figs":"Fig. 7  Photograph of the prototype.\nFig. 8  Experimental waveforms at the rated load.\nFig. 9  Measured efficiency and power factor versus output power.\nTABLE II  Comparison with the Conventional Configuration\n   | Conventional | Proposed\n  Intermediate voltage | 【要記入 ~400 V】 | 200 V\n  Intermediate capacitor | 【要記入 electrolytic, TBD µF】 | 【要記入 ceramic, TBD µF】\n  Number of switches | 【要記入 TBD】 | 6\n  Peak efficiency | 【要記入 TBD】 | 【要記入 TBD】\n  Power factor / THD | 【要記入 TBD】 | 【要記入 TBD】","draft":"A 480 W prototype shown in Fig. 7 was built with the parameters in Table I. The control was implemented on a dsPIC33EP128GS808 digital signal controller. Fig. 8 shows the measured waveforms at the rated load. 【要記入 波形の説明：入力電流が正弦波状、Vcs が 200 V 付近で変動、出力 48 V】\n\nFig. 9 shows the efficiency and the power factor versus the output power. The peak efficiency was 【要記入 TBD】 percent at 【要記入 TBD】 W, and the power factor exceeded 【要記入 TBD】 above 【要記入 TBD】 W. Table II compares the proposed converter with the conventional two-stage configuration."},{"id":"concl","name":"Conclusion","numbered":true,"status":"draft","pages":0.2,"hint":"主要な結果を数値で再掲し、今後の課題を一言。","points":"数値を記入、今後の課題を1文","figs":"","draft":"This paper proposed a single-stage bridgeless PFC converter integrating PSFB operation. The split intermediate capacitors serve as the input rails of the full bridge, which reduces the intermediate voltage to about 200 V and transfers the twice-line pulsation to the output side, so that the intermediate capacitors can be replaced with ceramic capacitors. The phase-shift design and the compensation of the transformer dc bias were derived. The experimental results with a 480 W prototype showed a power factor of 【要記入 TBD】 and a peak efficiency of 【要記入 TBD】 percent. 【要記入 今後の課題を1文：例 広入力電圧範囲への対応、軽負荷時の Vcs 上昇対策】"},{"id":"ack","name":"Acknowledgment","numbered":false,"status":"draft","pages":0.1,"hint":"APEC 2027 から AI 利用の明記が必須（IEEE AI Guidelines for Authors）。","points":"助成の有無を記入\nAI 利用の文面を実際の使い方に合わせる","figs":"","draft":"【要記入 研究助成があれば記載（例：This work was supported by JSPS KAKENHI Grant Number XXXX.）。無ければこの文を削除】\n\n【要記入 AI利用の記載（APEC 2027 必須）：IEEE AI Guidelines for Authors に沿って、実際の使い方に合わせて修正すること】 The authors used a generative AI tool (Claude, Anthropic) to assist in drafting and editing the text of this manuscript. All content was reviewed and revised by the authors, who take full responsibility for the content of this paper."},{"id":"ref","name":"References","numbered":false,"status":"todo","pages":0.4,"hint":"IEEE 形式。自己引用・相互引用は 20% 程度以下（要確認）、提出時に件数を申告。","points":"実在の文献で全件を確定","figs":"","draft":"[1] 【要記入 従来の Boost PFC ＋ PSFB 2段構成の代表的な文献】\n\n[2] 【要記入 PSFB コンバータの設計に関する文献】\n\n[3] 【要記入 単段 PFC コンバータの文献】\n\n[4] 【要記入 Buck PFC／ブリッジレス PFC の文献】\n\n[5] 【要記入 ブリッジレス PFC と絶縁型 DC-DC の統合方式の文献】\n\n[6] 【要記入 セラミックコンデンサによる中間コンデンサ小型化・パワーデカップリングの文献】\n\n[7] 【要記入 IEC 61000-3-2 (Limits for harmonic current emissions)】\n\n[8] 【要記入 自己引用・相互引用は全体の 20% 程度以下に抑え、提出時に件数を申告（要確認）】"}]}</script>
<script id="app-script">
(function(){
  document.getElementById('root').innerHTML=document.getElementById('app-shell').textContent;
  var KEY='apec-buckpfc-outline-v1';
  var STATUS=[['todo','未着手'],['outline','骨子'],['draft','執筆中'],['review','見直し'],['done','完成']];
  var STATUS_LABEL={};STATUS.forEach(function(s){STATUS_LABEL[s[0]]=s[1];});
  var state=JSON.parse(document.getElementById('paper-state').textContent);
  var publishedJSON=JSON.stringify(state);
  var dirty=false, readOnly=false, artifactNs=null, saving=false;
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function roman(n){var m=[[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']],r='';m.forEach(function(p){while(n>=p[0]){r+=p[1];n-=p[0];}});return r;}
  function words(t){t=(t||'').trim();return t?t.split(/\s+/).length:0;}
  function numbers(){var i=0,out={};state.sections.forEach(function(s){out[s.id]=s.numbered?roman(++i)+'.':'';});return out;}
  function setStatus(msg,warn){var el=$('status');el.textContent=msg;el.className='status-line'+(warn?' warn':'');}

  // restore an unsaved local draft made on top of this exact published version
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var d=JSON.parse(raw);
      if(d&&d.base===state.updatedAt&&JSON.stringify(d.state)!==publishedJSON){state=d.state;dirty=true;}
      else if(d&&d.base!==state.updatedAt){localStorage.removeItem(KEY);}
    }
  }catch(e){}

  function backup(){try{localStorage.setItem(KEY,JSON.stringify({base:JSON.parse(publishedJSON).updatedAt,state:state}));}catch(e){}}
  function markDirty(){dirty=true;backup();updateSummary();setStatus('未保存の変更があります（このブラウザには一時保存済み）');}

  function grow(t){t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px';}

  function secHTML(s,num){
    var opts=STATUS.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===s.status?' selected':'')+'>'+o[1]+'</option>';}).join('');
    return '<section class="sec" id="sec-'+esc(s.id)+'" data-id="'+esc(s.id)+'">'+
      '<header class="sec-head"><span class="sec-num">'+esc(num||'—')+'</span>'+
      '<input class="sec-title" id="name-'+esc(s.id)+'" data-k="name" value="'+esc(s.name)+'" aria-label="章タイトル">'+
      '<div class="sec-meta"><select id="status-'+esc(s.id)+'" data-k="status" aria-label="進捗">'+opts+'</select>'+
      '<label>目安 <input id="pages-'+esc(s.id)+'" data-k="pages" type="number" min="0" step="0.25" value="'+esc(s.pages)+'"> p</label></div></header>'+
      (s.hint?'<p class="hint">'+esc(s.hint)+'</p>':'')+
      '<div class="fields">'+
      '<label class="field"><span>要点・主張したいこと</span><textarea id="points-'+esc(s.id)+'" data-k="points">'+esc(s.points)+'</textarea></label>'+
      '<label class="field"><span>図・表・式</span><textarea id="figs-'+esc(s.id)+'" data-k="figs">'+esc(s.figs)+'</textarea></label>'+
      '<label class="field wide"><span>本文ドラフト</span><textarea class="draft" id="draft-'+esc(s.id)+'" data-k="draft">'+esc(s.draft)+'</textarea></label>'+
      '</div>'+
      '<footer class="sec-foot"><span class="wc" id="wc-'+esc(s.id)+'">'+words(s.draft)+' words</span>'+
      '<span class="tools save-only"><label style="display:flex;gap:4px;align-items:center"><input type="checkbox" id="num-'+esc(s.id)+'" data-k="numbered"'+(s.numbered?' checked':'')+'>章番号</label>'+
      '<button type="button" data-act="up" aria-label="上へ">↑</button><button type="button" data-act="down" aria-label="下へ">↓</button><button type="button" class="del" data-act="del">削除</button></span></footer>'+
      '</section>';
  }

  function renderSections(){
    var nums=numbers();
    $('sections').innerHTML=state.sections.map(function(s){return secHTML(s,nums[s.id]);}).join('');
    document.querySelectorAll('#sections textarea').forEach(grow);
    updateSummary();
  }

  function updateSummary(){
    var nums=numbers(), total=0, wc=0, limit=Number(state.pageLimit)||0;
    $('toc').innerHTML=state.sections.map(function(s){
      total+=Number(s.pages)||0; wc+=words(s.draft);
      return '<li><a href="#sec-'+esc(s.id)+'"><span class="n">'+esc(nums[s.id]||'·')+'</span><span class="nm">'+esc(s.name)+'</span><span class="pill s-'+esc(s.status)+'">'+esc(STATUS_LABEL[s.status]||s.status)+'</span></a></li>';
    }).join('');
    var bar=$('budget-bar'), denom=Math.max(limit,total)||1;
    var colors=['--accent','--st-review','--st-outline','--st-done','--st-todo'];
    bar.innerHTML=state.sections.map(function(s,i){var w=(Number(s.pages)||0)/denom*100;return '<i title="'+esc(s.name)+'" style="width:'+w+'%;background:var('+colors[i%colors.length]+');opacity:'+(0.55+0.45*((i+1)%2))+'"></i>';}).join('');
    var sum=$('budget-sum');sum.textContent=total.toFixed(2)+' / '+limit+' p';sum.className=total>limit+1e-6?'over':'';
    $('word-sum').textContent=wc.toLocaleString()+' words';
    var nn=numbers();state.sections.forEach(function(s){var el=document.querySelector('#sec-'+CSS.escape(s.id)+' .sec-num');if(el)el.textContent=nn[s.id]||'—';});
  }

  function bindMeta(){
    var map={'paper-title':'title','paper-authors':'authors','page-limit':'pageLimit','deadline':'deadline','notes':'notes'};
    Object.keys(map).forEach(function(id){
      var el=$(id);el.value=state[map[id]]==null?'':state[map[id]];
      if(el.tagName==='TEXTAREA')grow(el);
      el.addEventListener('input',function(){
        state[map[id]]=id==='page-limit'?Number(el.value):el.value;
        if(el.tagName==='TEXTAREA')grow(el);
        markDirty();
      });
    });
  }

  function findSec(el){var sec=el.closest('.sec');if(!sec)return null;var id=sec.getAttribute('data-id');for(var i=0;i<state.sections.length;i++)if(state.sections[i].id===id)return i;return null;}

  $('sections').addEventListener('input',function(e){
    var k=e.target.getAttribute('data-k'),i=findSec(e.target);if(k==null||i==null)return;
    var s=state.sections[i];
    if(k==='pages')s.pages=Number(e.target.value)||0;
    else if(k==='numbered')s.numbered=e.target.checked;
    else s[k]=e.target.value;
    if(e.target.tagName==='TEXTAREA')grow(e.target);
    if(k==='draft'){var w=$('wc-'+s.id);if(w)w.textContent=words(s.draft)+' words';}
    markDirty();
  });
  $('sections').addEventListener('change',function(e){
    var k=e.target.getAttribute('data-k'),i=findSec(e.target);if(i==null)return;
    if(k==='status'){state.sections[i].status=e.target.value;markDirty();}
    if(k==='numbered'){state.sections[i].numbered=e.target.checked;markDirty();}
  });
  $('sections').addEventListener('click',function(e){
    var b=e.target.closest('button[data-act]');if(!b)return;var i=findSec(b);if(i==null)return;
    var act=b.getAttribute('data-act'),arr=state.sections;
    if(act==='up'&&i>0){var t=arr[i-1];arr[i-1]=arr[i];arr[i]=t;}
    else if(act==='down'&&i<arr.length-1){var t2=arr[i+1];arr[i+1]=arr[i];arr[i]=t2;}
    else if(act==='del'){
      if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='もう一度で削除';setTimeout(function(){b.classList.remove('armed');b.textContent='削除';},3000);return;}
      arr.splice(i,1);
    } else return;
    renderSections();markDirty();
  });
  $('add-btn').addEventListener('click',function(){
    var id='s'+Date.now().toString(36);
    state.sections.splice(Math.max(state.sections.length-1,0),0,{id:id,name:'New Section',numbered:true,status:'todo',pages:0.5,hint:'',points:'',figs:'',draft:''});
    renderSections();markDirty();
    var el=$('name-'+id);if(el){el.focus();el.select();}
  });

  function toMarkdown(){
    var nums=numbers(),out=['# '+state.title,''];
    if(state.authors)out.push(state.authors,'');
    state.sections.forEach(function(s){
      out.push('## '+(nums[s.id]?nums[s.id]+' ':'')+s.name+'  ('+(STATUS_LABEL[s.status]||s.status)+', '+s.pages+' p)','');
      if(s.points)out.push('**要点**','',s.points,'');
      if(s.figs)out.push('**図・表**','',s.figs,'');
      if(s.draft)out.push(s.draft,'');
    });
    return out.join('\n');
  }
  $('md-btn').addEventListener('click',function(){
    var md=toMarkdown(),box=$('md-out');
    function fallback(){box.value=md;box.hidden=false;box.focus();box.select();setStatus('下の欄を選択してコピーしてください');}
    try{navigator.clipboard.writeText(md).then(function(){box.hidden=true;setStatus('Markdownをコピーしました');},fallback);}catch(e){fallback();}
  });

  function buildDoc(){
    var st=JSON.stringify(state).replace(/</g,'\\u003c');
    var SC='scr'+'ipt';
    var reset=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
    var shell=$('app-shell').textContent;
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
      '<title>APEC Buck PFC Paper</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap">\n'+
      '<style id="app-style">'+$('app-style').textContent+'</style>\n'+
      '<div id="root"></div>\n'+
      '<'+SC+' type="text/plain" id="app-shell">'+shell+'</'+SC+'>\n'+
      '<'+SC+' type="application/json" id="paper-state">'+st+'</'+SC+'>\n'+
      '<'+SC+' id="app-script">'+$('app-script').textContent+'</'+SC+'>'+
      '</body></html>';
  }

  function save(){
    if(saving||readOnly)return;
    if(!artifactNs){setStatus('この表示では保存できません。変更はこのブラウザに一時保存されています',true);return;}
    saving=true;$('save-btn').disabled=true;setStatus('保存中…');
    state.updatedAt=new Date().toISOString();
    var doc=buildDoc();
    artifactNs.publish(doc).then(function(){
      dirty=false;try{localStorage.removeItem(KEY);}catch(e){}
      setStatus('保存しました');
    },function(err){
      saving=false;$('save-btn').disabled=false;
      var c=err&&err.code;
      if(c==='conflict'){setStatus('他の場所で先に保存されたため、最新版を読み込みます',true);}
      else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'||c==='not_declared'||c==='capability_removed'){
        readOnly=true;document.body.classList.add('ro');setStatus('閲覧専用の表示です。保存はできません',true);}
      else if(c==='rate_limited'){setStatus('保存が続いたため少し待ってから保存してください',true);}
      else if(c==='too_large'){setStatus('ページが大きすぎて保存できません',true);}
      else{setStatus('保存に失敗しました。もう一度お試しください（変更は一時保存済み）',true);}
    });
  }
  $('save-btn').addEventListener('click',save);
  document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save();}});
  window.addEventListener('beforeunload',function(e){if(dirty&&!saving){e.preventDefault();e.returnValue='';}});

  bindMeta();renderSections();
  if(dirty)setStatus('前回の未保存の変更を復元しました。保存ボタンで確定してください');
  else setStatus('最終保存: '+new Date(state.updatedAt).toLocaleString());

  if(window.claude&&window.claude.use){
    window.claude.use('artifact').then(function(ns){artifactNs=ns;if(!ns){$('save-btn').disabled=true;setStatus('この表示では保存できません（ブラウザに一時保存のみ）',true);}});
  }
})();
</script></body></html>
